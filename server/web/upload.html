<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Together on the Road 미디어 업로드</title><style>body{font:16px system-ui,sans-serif;color:#171c23;background:#f4f6f8;margin:0;padding:32px}main{max-width:540px;margin:40px auto;background:white;border-radius:24px;padding:32px}h1{font-size:28px}label{display:block;margin:22px 0 8px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border:1px solid #d8dee7;border-radius:12px}button{background:#1966ee;color:white;border:0;margin-top:24px;cursor:pointer}small{color:#707984;line-height:1.7}#status{white-space:pre-wrap;line-height:1.6}</style><main><small>TOGETHER ON THE ROAD</small><h1>함께 듣고 기억하는 여정</h1><p>차량 화면에 표시된 코드로 음악 또는 장소 추억을 올립니다.</p><form id="form"><label for="group">그룹 코드 8자리</label><input id="group" maxlength="8" required autocomplete="off"><label for="code">일회용 업로드 코드 8자리</label><input id="code" maxlength="8" required autocomplete="off"><label for="file">사진 또는 오디오 파일</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,audio/mpeg,audio/mp4,audio/wav" required><label><input id="consent" type="checkbox" required style="width:auto"> 그룹에 이 파일을 공유할 권한이 있습니다</label><small>음악은 MP3 M4A WAV 20MB 이하, 사진은 5MB 이하입니다. 파일은 현재 그룹의 임시 서버에 보관되며 개인 보관을 선택한 사본은 별도로 남을 수 있습니다.</small><button id="send">그룹에 업로드</button></form><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id);let ticket=null;
$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;$('status').textContent='파일을 확인하고 있습니다';
try{let file=$('file').files[0],mime=file.type;if(mime==='audio/x-wav')mime='audio/wav';if(mime==='audio/x-m4a')mime='audio/mp4';
if(file.size>20*1024*1024)throw Error('파일은 20MB 이하여야 합니다');let duration=0;
if(mime.startsWith('audio/'))duration=await new Promise((resolve,reject)=>{const audio=new Audio(),url=URL.createObjectURL(file);const timer=setTimeout(()=>{URL.revokeObjectURL(url);reject(Error('오디오 길이 확인 시간 초과'))},10000);audio.onloadedmetadata=()=>{clearTimeout(timer);URL.revokeObjectURL(url);Number.isFinite(audio.duration)&&audio.duration>0?resolve(Math.round(audio.duration*1000)):reject(Error('오디오 길이 오류'))};audio.onerror=()=>{clearTimeout(timer);URL.revokeObjectURL(url);reject(Error('지원하지 않는 오디오 형식'))};audio.src=url});
if(mime.startsWith('image/')){const bitmap=await createImageBitmap(file),ratio=Math.min(1,2048/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();file=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.85));mime='image/jpeg';if(!file)throw Error('사진 처리 실패')}
if(!ticket){const response=await fetch('/pair-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inviteCode:$('group').value.trim(),code:$('code').value.trim()})});const pair=await response.json();if(!response.ok)throw Error(pair.error);ticket=pair.ticket;}
$('status').textContent='그룹 서버에 실제 파일을 업로드하고 있습니다';const response=await fetch('/paired-media',{method:'POST',headers:{'Content-Type':mime,'Authorization':'Bearer '+ticket,'X-Media-Name':encodeURIComponent($('file').files[0].name),'X-Duration-Ms':String(duration)},body:file});const result=await response.json();if(!response.ok)throw Error(result.error);ticket=null;$('status').textContent='업로드했습니다. 음악 수신에 동의한 차량에서 재생되거나, 선택한 장소의 추억으로 등록됩니다.';$('form').reset();
}catch(error){$('status').textContent='업로드 실패: '+error.message}finally{$('send').disabled=false}};
</script></html>
